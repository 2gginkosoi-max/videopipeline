<div class="placeholder-panel glass-panel profile-panel" style="text-align:left; align-items:stretch;">
  <span class="placeholder-panel__title">ПРОФИЛЬ</span>

  <div class="field__row" style="gap:16px;">
    <div class="user-chip__avatar" id="profileAvatar" style="width:64px; height:64px; font-size:20px;">?</div>
    <div>
      <div id="profileName" style="font-size:18px;">Гость</div>
      <div class="hint" id="profileEmail">войдите, чтобы собирать ролики</div>
    </div>
  </div>

  <div class="profile-row">
    <span>Моих роликов</span>
    <span class="profile-row__value" id="profVideos">—</span>
  </div>
  <div class="profile-row">
    <span>Моих голосов</span>
    <span class="profile-row__value" id="profVoices">0</span>
  </div>

  <div class="profile-block">
    <div class="profile-block__head">Мои голоса</div>
    <div class="profile-list" id="profileVoiceList">
      <div class="hint">загрузка…</div>
    </div>
  </div>

  <div class="profile-block">
    <div class="profile-block__head">Мои сценарии</div>
    <div class="profile-list" id="profileScenarioList">
      <div class="hint">загрузка…</div>
    </div>
  </div>

  <div class="field__row">
    <button type="button" class="btn btn--mini btn--ghost" id="profileLogout">Выйти из аккаунта</button>
  </div>

  <div class="hint">
    Ролики лежат на вкладке «Архив» — оттуда их можно скачать или удалить.
  </div>
</div>
